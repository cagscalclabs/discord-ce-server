name: Tests

# Unit tests for the relay: protocol framing, session and link handling, OIDC
# token validation, permission filtering, and configuration loading. These use
# generated signing keys, fake provider responses, mocked Discord objects, and
# local sockets — nothing here talks to Discord or a live OIDC registration.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unittest:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the documented floor; 3.13 guards against upcoming breakage.
        python-version: ['3.10', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s . -p 'test_*.py' --verbose
